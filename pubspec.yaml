name: camtrip
description: "CamTrip prototype: snap foreign text, translate on device, keep it as a trip."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  google_mlkit_text_recognition: ">=0.13.0 <1.0.0"
  google_mlkit_translation: ">=0.12.0 <1.0.0"
  google_mlkit_language_id: ">=0.12.0 <1.0.0"
  google_fonts: ^9.0.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/
